<body class="login-body"><main class="login-shell"><section class="login-brand"><div class="brand">ROUTINE</div><div><span class="eyebrow">PERSONAL PERFORMANCE SYSTEM</span><h1>Consistência<br>virou sistema.</h1><p>Planeje o dia. Execute. Meça sua aderência. Ajuste o que realmente importa.</p></div><small>Rotina → Execução → Evolução</small></section>
