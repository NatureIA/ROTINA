name: Deploy ROUTINE 2.0 to Staging

on:
  push:
    branches: [ routine-2.0 ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routine-2-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/routine-2.0'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Guard staging credentials
        id: staging_guard
        shell: pwsh
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace("${{ secrets.STAGING_WEBSITE_NAME }}")) {
            $missing += "STAGING_WEBSITE_NAME"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.STAGING_SERVER_COMPUTER_NAME }}")) {
            $missing += "STAGING_SERVER_COMPUTER_NAME"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.STAGING_SERVER_USERNAME }}")) {
            $missing += "STAGING_SERVER_USERNAME"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.STAGING_SERVER_PASSWORD }}")) {
            $missing += "STAGING_SERVER_PASSWORD"
          }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.STAGING_BASE_URL }}")) {
            $missing += "STAGING_BASE_URL"
          }

          if ($missing.Count -gt 0) {
            Write-Host ("Staging ainda não configurado. Secrets ausentes: " + ($missing -join ", "))
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          if ("${{ secrets.STAGING_WEBSITE_NAME }}" -eq "${{ secrets.WEBSITE_NAME }}") {
            Write-Error "Proteção acionada: o website de staging não pode ser o mesmo website da produção."
            exit 1
          }

          $stagingUrl = "${{ secrets.STAGING_BASE_URL }}".TrimEnd('/')
          if ($stagingUrl -eq "https://routine.runasp.net") {
            Write-Error "Proteção acionada: STAGING_BASE_URL aponta para a URL de produção."
            exit 1
          }

          "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Credenciais e URL de staging separadas da produção: OK"

      - name: Validate frontend
        if: steps.staging_guard.outputs.configured == 'true'
        shell: pwsh
        run: |
          node --check wwwroot/js/app2.js
          node --check wwwroot/js/pwa.js
          node --check wwwroot/service-worker.js
          node --check scripts/validate-ui.js
          node scripts/validate-ui.js
          node -e "JSON.parse(require('fs').readFileSync('wwwroot/manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Setup .NET 8
        if: steps.staging_guard.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore
        if: steps.staging_guard.outputs.configured == 'true'
        run: dotnet restore Routine.csproj

      - name: Build
        if: steps.staging_guard.outputs.configured == 'true'
        run: dotnet build Routine.csproj --configuration Release --no-restore

      - name: Run business rule tests
        if: steps.staging_guard.outputs.configured == 'true'
        run: dotnet test Routine.Tests/Routine.Tests.csproj --configuration Release

      - name: Publish staging package
        if: steps.staging_guard.outputs.configured == 'true'
        run: dotnet publish Routine.csproj --configuration Release --output ./publish-staging --runtime win-x86 --self-contained false

      - name: Save staging package
        if: steps.staging_guard.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: routine-2-staging-${{ github.sha }}
          path: ./publish-staging
          retention-days: 7

      - name: Deploy to staging via WebDeploy
        if: steps.staging_guard.outputs.configured == 'true'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.STAGING_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.STAGING_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.STAGING_SERVER_USERNAME }}
          server-password: ${{ secrets.STAGING_SERVER_PASSWORD }}


      - name: Verify staging health
        if: steps.staging_guard.outputs.configured == 'true'
        shell: pwsh
        run: |
          $baseUrl = "${{ secrets.STAGING_BASE_URL }}".TrimEnd('/')
          $healthUrl = "$baseUrl/health"
          $maxAttempts = 12

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 15

              if ($health.version -eq "2.0" -and
                  $health.status -eq "ok" -and
                  $health.database -eq "ready") {
                Write-Host "ROUTINE 2.0 staging saudável: $healthUrl"
                exit 0
              }

              Write-Host "Tentativa $attempt/$maxAttempts: staging respondeu, mas ainda não está pronto. status=$($health.status), database=$($health.database), version=$($health.version)"
            }
            catch {
              Write-Host "Tentativa $attempt/$maxAttempts: staging ainda indisponível."
            }

            Start-Sleep -Seconds 5
          }

          Write-Error "Staging não atingiu estado saudável em $healthUrl."
          exit 1
