name: Validate ROUTINE 2.0

on:
  push:
    branches: [ routine-2.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
      - name: Restore
        run: dotnet restore Routine.csproj
      - name: Build
        run: dotnet build Routine.csproj --configuration Release --no-restore
